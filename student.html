<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学生成绩卡 - MakeX Inspire 成绩统计系统</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <script src="shared.js"></script>
    <script src="shared_indexdb.js"></script>
    <script src="header.js"></script>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <span class="card-title">👤 个人成绩卡</span>
                <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">
                    <div class="view-toggle" id="sourceToggle" style="display:none;">
                        <button class="view-btn" data-source="competition">🏆 模拟练习</button>
                        <button class="view-btn" data-source="practice">🎯 自主训练</button>
                        <button class="view-btn active" data-source="all">📊 整合</button>
                    </div>
                    <select id="studentSelect" aria-label="选择学员" style="min-width:160px;">
                        <option value="">— 请选择学员 —</option>
                    </select>
                </div>
            </div>
            <div id="studentCardContent">
                <div class="empty-state"><div class="icon">👆</div><p>请在上方选择学员查看个人成绩</p></div>
            </div>
        </div>

        <!-- ===== 自主训练录入 ===== -->
        <div class="card" id="practiceEntryCard" style="display:none;">
            <div class="card-header">
                <span class="card-title">🎯 自主训练录入</span>
                <span class="card-subtitle" id="practiceEntryTrainingName"></span>
            </div>
            <div class="form-row">
                <select id="practiceTaskSelect" aria-label="选择任务" style="min-width:140px;">
                    <option value="">— 选择任务 —</option>
                </select>
                <input type="number" id="practiceScoreInput" placeholder="得分" min="0" step="1" style="width:90px;padding:0.5rem 0.6rem;border:1px solid var(--gray-300);border-radius:var(--radius-sm);font-size:0.9rem;text-align:center;appearance:textfield;-moz-appearance:textfield;" />
                <input type="number" id="practiceTimeInput" placeholder="用时(秒)" min="0" step="0.001" style="width:110px;padding:0.5rem 0.6rem;border:1px solid var(--gray-300);border-radius:var(--radius-sm);font-size:0.9rem;text-align:center;appearance:textfield;-moz-appearance:textfield;" />
                <button class="btn btn-primary" id="practiceSubmitBtn">📝 提交记录</button>
            </div>
            <div class="form-note" id="practiceEntryNote" style="font-size:0.78rem;color:var(--gray-400);margin-top:0.5rem;">
                提交时自动记录时间；修改已提交的成绩不会改变原提交时间。
            </div>
        </div>

        <!-- ===== 练习记录列表 ===== -->
        <div class="card" id="practiceListCard" style="display:none;">
            <div class="card-header">
                <span class="card-title">📋 我的练习记录</span>
                <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">
                    <span class="card-subtitle" id="practiceListCount"></span>
                    <button class="btn btn-sm btn-outline" id="exportPracticeBtn" title="导出当前学员的练习记录（数据类型/得分/用时/记录时间）">📤 导出</button>
                    <button class="btn btn-sm btn-outline" id="importPracticeBtn" title="导入练习记录 CSV，缺失信息手动补充">📥 导入</button>
                </div>
            </div>
            <div id="practiceListContent">
                <!-- Rendered by JS -->
            </div>
        </div>
    </div>

    <!-- ========== Modal: 导入练习记录 ========== -->
    <div class="modal-overlay" id="importPracticeModal">
        <div class="modal-box">
            <h3>📥 导入练习记录</h3>
            <div class="form-group">
                <label>目标集训</label>
                <select id="importTrainingSelect" aria-label="选择目标集训" style="width:100%;padding:0.5rem 0.85rem;border:1px solid var(--gray-300);border-radius:var(--radius-sm);font-size:0.9rem;background:#fff;color:var(--gray-800);"></select>
            </div>
            <div class="form-group">
                <label>任务类型映射（stu_tool 导出为「基础/随机」）</label>
                <div class="form-row" style="gap:0.4rem;align-items:center;">
                    <span style="font-size:0.85rem;color:var(--gray-600);white-space:nowrap;">基础 →</span>
                    <select id="importBasicTask" aria-label="基础对应任务" style="flex:1;min-width:100px;padding:0.4rem 0.6rem;border:1px solid var(--gray-300);border-radius:var(--radius-sm);font-size:0.85rem;background:#fff;color:var(--gray-800);"></select>
                    <span style="font-size:0.85rem;color:var(--gray-600);white-space:nowrap;">随机 →</span>
                    <select id="importRandomTask" aria-label="随机对应任务" style="flex:1;min-width:100px;padding:0.4rem 0.6rem;border:1px solid var(--gray-300);border-radius:var(--radius-sm);font-size:0.85rem;background:#fff;color:var(--gray-800);"></select>
                </div>
            </div>
            <div class="form-group">
                <label>粘贴数据（stu_tool 导出格式：姓名, 任务类型, 得分, 用时, 失误点, 记录时间）</label>
                <textarea id="importPracticeCsv" aria-label="导入数据" style="width:100%;height:160px;padding:0.6rem;border:1px solid var(--gray-300);border-radius:var(--radius-sm);font-size:0.85rem;font-family:inherit;resize:vertical;" placeholder="张三, 基础, 800, 12.5, , 2026-08-07 15:13:58&#10;张三, 随机, 700, , drop失败, 2026-08-07 16:00:00"></textarea>
            </div>
            <div class="form-note" style="font-size:0.75rem;color:var(--gray-400);margin-top:0.4rem;">
                学员按姓名匹配（找不到会提示）；记录时间缺失则用当前时间；导入后归属所选集训。
            </div>
            <div id="importPracticeResult" style="font-size:0.85rem;margin-top:0.5rem;min-height:1.2rem;"></div>
            <div class="modal-actions">
                <button class="btn btn-outline" id="importPracticeCancel">取消</button>
                <button class="btn btn-primary" id="importPracticeConfirm">📥 导入</button>
            </div>
        </div>
    </div>

    <!-- ========== Modal: 编辑练习记录 ========== -->
    <div class="modal-overlay" id="editPracticeModal">
        <div class="modal-box">
            <h3>✏️ 修改练习记录</h3>
            <div id="editPracticeMeta" style="font-size:0.8rem;color:var(--gray-500);margin-bottom:0.75rem;"></div>
            <div class="form-group">
                <label>得分</label>
                <input type="number" id="editPracticeScoreInput" aria-label="编辑得分" min="0" step="1" style="width:100%;padding:0.5rem 0.85rem;border:1px solid var(--gray-300);border-radius:var(--radius-sm);font-size:0.9rem;appearance:textfield;-moz-appearance:textfield;" />
            </div>
            <div class="form-group">
                <label>用时（秒）</label>
                <input type="number" id="editPracticeTimeInput" aria-label="编辑用时" min="0" step="0.001" style="width:100%;padding:0.5rem 0.85rem;border:1px solid var(--gray-300);border-radius:var(--radius-sm);font-size:0.9rem;appearance:textfield;-moz-appearance:textfield;" />
            </div>
            <div class="form-group" id="editPracticeSubmitted" style="font-size:0.78rem;color:var(--gray-400);"></div>
            <div class="modal-actions">
                <button class="btn btn-outline" id="editPracticeCancel">取消</button>
                <button class="btn btn-primary" id="editPracticeSave">💾 保存</button>
            </div>
        </div>
    </div>

    <!-- ========== Toast Container ========== -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="student.js"></script>
</body>
</html>
